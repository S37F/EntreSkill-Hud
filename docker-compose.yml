services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: entreskill
      POSTGRES_PASSWORD: entreskill
      POSTGRES_DB: entreskill
    ports:
      - "5432:5432"
    volumes:
      - entreskill_pg:/var/lib/postgresql/data

volumes:
  entreskill_pg:
